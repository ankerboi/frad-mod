name: Build (Windows)

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Enable sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgJsonGlob: 'vcpkg.json'
        vcpkgConfigurationJsonGlob: 'vcpkg-configuration.json'
        doNotCache: true

    - name: Get vcpkg commit
      id: vcpkg-commit
      shell: bash
      run: echo "sha=$(git -C '${{ github.workspace }}/vcpkg' rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache vcpkg installed packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/build/vcpkg_installed
          ${{ github.workspace }}/build_ds/vcpkg_installed
        key: vcpkg-windows-latest-${{ steps.vcpkg-commit.outputs.sha }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-windows-latest-${{ steps.vcpkg-commit.outputs.sha }}-

    - name: Build Windows
      run: |
        mkdir ${{ github.workspace }}/release
        cmake -A Win32 -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release -S ${{ github.workspace }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DOUTDIR=${{ github.workspace }}/release -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET:STRING=x86-windows-static
        cmake --build ${{ github.workspace }}/build --config Release --target csgo srcds csgo_gc

    - name: Setup Python (frad-mod)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Build frad-mod
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller pillow
        python -m PyInstaller --noconfirm --clean --onefile --windowed \
          --name frad-mod \
          --icon frad-mod/logo.ico \
          --add-data "frad-mod/logo.ico;." \
          --add-data "frad-mod/gloves.png;." \
          --add-data "frad-mod/knife.png;." \
          --add-data "frad-mod/agent.png;." \
          --add-data "frad-mod/equiped.png;." \
          frad-mod/frad-mod.py
        cp dist/frad-mod.exe "$GITHUB_WORKSPACE/release/frad-mod.exe"

    - name: Package
      shell: bash
      run: |
        cp $GITHUB_WORKSPACE/README.md $GITHUB_WORKSPACE/release/
        mkdir $GITHUB_WORKSPACE/release/licenses
        cp $GITHUB_WORKSPACE/LICENSE $GITHUB_WORKSPACE/release/licenses/LICENSE-csgo_gc.txt
        cp $GITHUB_WORKSPACE/build/_deps/distorm-src/COPYING $GITHUB_WORKSPACE/release/licenses/LICENSE-distorm.txt
        cp $GITHUB_WORKSPACE/build/_deps/funchook-src/LICENSE $GITHUB_WORKSPACE/release/licenses/LICENSE-funchook.txt
        mkdir $GITHUB_WORKSPACE/release/csgo_gc
        cp $GITHUB_WORKSPACE/examples/config.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/inventory.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/server.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/unusual_loot_lists.txt $GITHUB_WORKSPACE/release/csgo_gc/

        VCPKG_SHARE="$GITHUB_WORKSPACE/build/vcpkg_installed/x86-windows-static/share"
        for portdir in "$VCPKG_SHARE"/*/; do
          port=$(basename "$portdir")
          if [ -f "${portdir}copyright" ]; then
            cp "${portdir}copyright" "$GITHUB_WORKSPACE/release/licenses/LICENSE-$port.txt"
          fi
        done

    - name: Zip artifacts
      shell: pwsh
      run: |
        $releasePath = Join-Path $env:GITHUB_WORKSPACE 'release'
        $out = Join-Path $env:GITHUB_WORKSPACE 'frad-mod-windows-latest.zip'
        
        if (-not (Test-Path $releasePath) -or (Get-ChildItem $releasePath).Count -eq 0) {
          Write-Error "Release directory is missing or empty!"
          exit 1
        }
        
        if (Test-Path $out) { Remove-Item $out -Force }
        Compress-Archive -Path "$releasePath\*" -DestinationPath $out -Force
        Get-Item $out

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: frad-mod-windows-latest
        path: frad-mod-windows-latest.zip
        if-no-files-found: error
        overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create continuous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG=continuous
          files=( $(find artifacts -type f -name "*.zip") )

          if [ ${#files[@]} -gt 0 ]; then
            gh release delete "$TAG" --cleanup-tag --repo "$REPO" --yes || true
            sleep 5s
            gh release create "$TAG" --repo "$REPO" \
              --title "Continuous Build" \
              --notes "Latest build from commit $SHA" \
              --target "$SHA"

            gh release upload "$TAG" --repo "$REPO" "${files[@]}" --clobber
          fi